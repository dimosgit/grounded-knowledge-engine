<svg viewBox="0 44 1120 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gke-architecture-readme-title gke-architecture-readme-desc">
  <title id="gke-architecture-readme-title">Grounded Knowledge Engine architecture</title>
  <desc id="gke-architecture-readme-desc">AI coding agents call one local MCP server, which answers from a disposable retrieval index, writes explicit captures back to canonical Markdown records, and resumes projects from them; document ingestion adds new records and the optional Cockpit reads them.</desc>
